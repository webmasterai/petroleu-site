server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router SPA fallback (/admin/login, /about, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No /api proxy on the frontend container — CMS is a separate Laravel resource.
    location /api/ {
        default_type application/json;
        return 404 '{"success":false,"message":"API is not on this host. Set VITE_CMS_API_BASE_URL at build time."}';
    }
}
